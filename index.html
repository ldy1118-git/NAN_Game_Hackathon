<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 모바일에서 두 손가락으로 확대하면 판정 타이밍만 흐트러진다. 확대를 막는다. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>SNAP GAMES — 박자와 순발력에 맞춰 누르는 종합게임</title>
    <meta
      name="description"
      content="박자와 순발력에 맞춰 누르는 종합게임. 미니게임 10종을 쉬움·보통·어려움으로, 이어서 하는 도전 모드까지. 오디오 클럭을 마스터 클럭으로 써서 소리와 그림이 딱딱 맞습니다."
    />
    <meta name="theme-color" content="#FBF3E4" />

    <link rel="canonical" href="https://nan-game-hackathon.vercel.app/" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <!--
      카톡·디스코드·슬랙에 링크를 붙였을 때 뜨는 카드.

      og:image 만은 상대 경로를 쓰지 않는다. 카톡·페이스북 스크레이퍼는 절대 URL을
      요구해서, 상대 경로면 카드에 이미지가 비어 나온다. 나머지 자산은 './' 로 둬야
      dist/index.html 을 파일로 열어도 돌아가므로 여기만 예외다.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SNAP GAMES" />
    <meta property="og:url" content="https://nan-game-hackathon.vercel.app/" />
    <meta property="og:title" content="SNAP GAMES — 박자와 순발력에 맞춰 누르는 종합게임" />
    <meta
      property="og:description"
      content="박자와 순발력에 맞춰 누르는 종합게임. 미니게임 10종 + 도전 모드."
    />
    <meta property="og:image" content="https://nan-game-hackathon.vercel.app/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SNAP GAMES — 여섯 캐릭터가 나란히 선 타이틀 화면" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%;
        background: #14131a;
        overflow: hidden;
        font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #app {
        width: 100%; height: 100%;
        display: flex; align-items: center; justify-content: center;
      }
      canvas {
        display: block;
        image-rendering: auto;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="app"><canvas id="stage"></canvas></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
