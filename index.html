<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 모바일에서 두 손가락으로 확대하면 판정 타이밍만 흐트러진다. 확대를 막는다. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>NAN GAME — 리듬 미니게임</title>
    <meta
      name="description"
      content="박자에 맞춰 누르는 리듬천국식 콜 앤 리스폰스 미니게임 모음. 오디오 클럭을 마스터 클럭으로 써서 소리와 그림이 딱딱 맞습니다."
    />
    <meta name="theme-color" content="#FBF3E4" />

    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- 카톡·디스코드·슬랙에 링크를 붙였을 때 뜨는 카드 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NAN GAME — 리듬 미니게임" />
    <meta
      property="og:description"
      content="박자에 맞춰 누르는 리듬천국식 콜 앤 리스폰스 미니게임 모음."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%;
        background: #14131a;
        overflow: hidden;
        font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #app {
        width: 100%; height: 100%;
        display: flex; align-items: center; justify-content: center;
      }
      canvas {
        display: block;
        image-rendering: auto;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="app"><canvas id="stage"></canvas></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
