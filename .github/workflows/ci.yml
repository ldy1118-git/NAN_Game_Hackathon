name: CI

# 셋이 동시에 작업하므로, main 에 들어가기 전에 타입체크와 빌드를 반드시 통과시킨다.
# Vercel 도 배포할 때 같은 명령을 돌리지만, 그건 배포 설정에 의존한다.
# 여기서 한 번 더 돌려 저장소만으로도 검증이 되게 한다.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # npm run build = tsc --noEmit && vite build
      # 타입 에러가 있으면 여기서 멈춘다.
      - run: npm run build
